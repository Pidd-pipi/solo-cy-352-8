name: lpboardgame

services:
  db:
    image: mongo:7
    container_name: ${COMPOSE_PROJECT_NAME:-lpboardgame}-db
    restart: unless-stopped
    # 单节点副本集：后端多文档事务（下单/取消/充值原子性）的前提
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    environment:
      MONGO_INITDB_DATABASE: ${DB_NAME}
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-27017}:27017"
    volumes:
      - db_data:/data/db
    healthcheck:
      # 未初始化时执行 rs.initiate，副本集就绪前保持 unhealthy，后端会等待
      test: ["CMD-SHELL", "mongosh \"mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin\" --quiet --eval \"try { if (rs.status().ok === 1) quit(0); quit(1); } catch (e) { try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'db:27017'}]}); } catch (e2) {}; quit(1); }\""]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-lpboardgame}-backend
    restart: unless-stopped
    environment:
      PORT: 29512
      DB_HOST: db
      DB_PORT: 27017
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DATABASE_URL: mongodb://${DB_USER}:${DB_PASSWORD}@db:27017/${DB_NAME}?authSource=admin&replicaSet=rs0
      SPRING_DATASOURCE_URL: 
      SPRING_DATASOURCE_DRIVER: 
      SPRING_JPA_DATABASE_PLATFORM: 
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${BACKEND_PORT:-29512}:29512"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:29512/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-lpboardgame}-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-28512}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
